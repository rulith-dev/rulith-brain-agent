<!doctype html>
<!-- The desktop shell's own page: shown while the agent starts (Rulith Brain not running yet, the model loading)
     and after it ended. The agent's page takes the window when it is up. English or Chinese by the system's
     language. States are words and marks, never colour alone. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rulith Brain Agent</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --fg: #0f172a; --dim: #475569; --line: #e2e6ec; --accent: #2563eb; --on-accent: #ffffff;
    --soft: #eef2f6; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --card: #162036; --fg: #f1f5f9; --dim: #cbd5e1; --line: #2a3650; --accent: #2563eb; --soft: #1b2740; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  main { width: min(620px, 100%); }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .brand img { width: 52px; height: 52px; flex: none; }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .brand p { margin: 2px 0 0; color: var(--dim); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .state { display: flex; align-items: flex-start; gap: 12px; }
  .state h2 { margin: 0 0 4px; font-size: 17px; }
  .state p { margin: 0; color: var(--dim); }
  .mark { flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent);
    animation: turn 1s linear infinite; }
  .mark.still { animation: none; border-color: var(--dim); border-style: dashed; }
  @keyframes turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  h3 { margin: 0 0 4px; font-size: 14px; }
  .dim { color: var(--dim); margin: 0; }
  pre { margin: 10px 0 0; padding: 10px 12px; background: var(--soft); border-radius: 8px; font: 12px/1.5 Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; max-height: 190px; overflow: auto; }
  button { margin-top: 14px; padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent);
    font: 600 14px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
  button:focus-visible { outline: 3px solid rgba(37, 99, 235, .35); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .version { margin-top: 6px; color: var(--dim); font-size: 12px; text-align: right; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="icon.svg" alt="">
    <div><h1>Rulith Brain Agent</h1><p id="tagline"></p></div>
  </div>
  <p id="capacity" hidden></p>
  <section class="card" role="status" aria-live="polite">
    <div class="state">
      <div class="mark" id="mark" aria-hidden="true"></div>
      <div><h2 id="state-title"></h2><p id="state-help"></p></div>
    </div>
    <pre id="lines" hidden></pre>
    <button type="button" id="again" hidden></button>
  </section>
  <section class="card">
    <h3 id="about-title"></h3>
    <p class="dim" id="about-text"></p>
  </section>
  <div class="version" id="version"></div>
</main>
<script src="shell.js"></script>
</body>
</html>
